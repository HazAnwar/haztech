<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        var base = window.location.hostname.includes('github.io') ? '/haztech/' : '/';
        document.write('<base href="' + base + '" />');
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HazTech Services</title>
    
    <!-- METADATA_START -->
    <!-- Filled in per page at build time by prerender.js (from src/seo.js). -->
    <meta name="description" content="HazTech Services Limited is an independent UK developer and publisher of Bloop Brigade, Markaz and Leap Launcher." />
    <!-- METADATA_END -->

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var preferDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && preferDark)) {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
